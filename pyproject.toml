[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-app"
version = "0.2.0"
authors = [
    {name = "rbaker1987", email = "your.email@example.com"},
]
description = "A modernized weather forecasting application using NWS API"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "requests>=2.31.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "loguru>=0.7.0",
    "timezonefinder>=6.2.0",  # Derive IANA timezone from lat/lon
    "astral>=3.2",  # Accurate sunrise/sunset calculation
    "pytz>=2024.1",  # Timezone support
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.5.0",
    "ruff>=0.6.0",
    "mypy>=1.7.0",
    "pre-commit>=3.6.0",
    "django-stubs>=4.2.0",
]
django = [
    "Django>=4.2.0",              # Django framework
    "djangorestframework>=3.14.0", # REST API for Django
    "django-cors-headers>=4.3.0",  # CORS support
    "psycopg2-binary>=2.9.0",      # PostgreSQL support
    "dj-database-url>=2.2.0",      # DATABASE_URL parsing
    "gunicorn>=21.2.0",            # WSGI server for Render
    "whitenoise>=6.6.0",           # Static file serving
]

[project.urls]
"Homepage" = "https://github.com/rbaker1987/Weather"
"Bug Reports" = "https://github.com/rbaker1987/Weather/issues"
"Source" = "https://github.com/rbaker1987/Weather"

# Django management commands available via:
# cd weather_app && python manage.py <command>

[tool.setuptools.packages.find]
where = ["."]
include = ["weather_app*"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
DJANGO_SETTINGS_MODULE = "config.settings"
markers = [
    "django_db: mark test as requiring database access",
]

[tool.coverage.run]
relative_files = true
source = ["weather_app"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
