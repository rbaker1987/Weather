services:
  - type: web
    name: weather-app
    env: python
    plan: free
    buildCommand: ./render-build.sh
    startCommand: ./render-start.sh
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: DJANGO_DEBUG
        value: 'False'
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: weather-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: weather-redis
          property: connectionString

  - type: worker
    name: weather-worker
    env: python
    plan: free
    buildCommand: ./render-build.sh
    startCommand: ./render-worker.sh
    autoDeploy: true
    envVars:
      - key: DJANGO_DEBUG
        value: 'False'
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: weather-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: weather-redis
          property: connectionString

  - type: redis
    name: weather-redis
    plan: free

databases:
  - name: weather-db
    plan: free
