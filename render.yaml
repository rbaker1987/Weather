services:
  - type: web
    name: weather-app
    env: python
    plan: free
    buildCommand: pip install .[django] ; cd weather_app ; python manage.py collectstatic --noinput
    startCommand: cd weather_app ; gunicorn config.wsgi:application
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: weather-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: weather-redis
          property: connectionString

  - type: worker
    name: weather-worker
    env: python
    plan: free
    buildCommand: pip install .[django]
    startCommand: cd weather_app ; celery -A config worker --loglevel=info
    autoDeploy: true
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: weather-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: weather-redis
          property: connectionString

  - type: redis
    name: weather-redis
    plan: free

databases:
  - name: weather-db
    plan: free
