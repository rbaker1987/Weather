# Render free web service. No database, Redis, or worker: SQLite is a disposable
# cache rebuilt by `migrate` on every start. The live service is dashboard-managed.
services:
  - type: web
    name: Weather
    env: python
    plan: free
    branch: master
    buildCommand: ./render-build.sh
    startCommand: ./render-release.sh && ./render-start.sh
    autoDeploy: true
    envVars:
      - key: DJANGO_DEBUG
        value: 'False'
      - key: DJANGO_SECRET_KEY
        generateValue: true
