name: Auto Label and Assign

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

jobs:
  label_assign:
    runs-on: ubuntu-latest
    steps:
      - name: Add labels and assign PR author
        uses: actions/github-script@v8
        with:
          script: |
            const pr = context.payload.pull_request;
            const author = pr.user.login;
            const fallback = pr.base.repo.owner.login;

            // Fetch changed files to determine labels
            const files = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number
            });

            const changedFiles = files.data.map(f => f.filename);
            const labels = new Set();

            // Auto-detect labels based on file changes
            if (changedFiles.some(f => f.includes('test_') || f.includes('tests/'))) {
              labels.add('tests');
            }
            if (changedFiles.some(f => f.includes('README') || f.includes('.md') || f.includes('docs/'))) {
              labels.add('documentation');
            }

            // Frontend vs backend detection
            if (changedFiles.some(f => f.startsWith('weather_app/static') || f.includes('templates/'))) {
              labels.add('frontend');
            }
            if (changedFiles.some(f => f.startsWith('weather_app/weather') || f.startsWith('weather_app/config') || f.includes('api/') || f.includes('services/') || f.includes('views'))) {
              labels.add('backend');
            }

            // Subdir-based labels (top-level directory names)
            changedFiles.forEach(f => {
              const top = f.split('/')[0];
              if (top && top !== '.' && top !== '') {
                labels.add(`dir:${top}`);
              }
            });

            // Branch/PR title/body based labels
            const branchName = pr.head.ref.toLowerCase();
            const prTitle = pr.title.toLowerCase();
            const prBody = (pr.body || '').toLowerCase();
            const prText = `${branchName} ${prTitle} ${prBody}`;

            if (branchName.startsWith('feature/') || prText.includes('feature') || prText.includes('feat:')) {
              labels.add('feature');
            }
            if (branchName.startsWith('fix/') || prText.includes('fix') || prText.includes('bug')) {
              labels.add('bug');
            }
            if (branchName.includes('update') || prText.includes('update') || prText.includes('upgrade')) {
              labels.add('update');
            }

            // Add labels if any were detected
            const labelsArray = Array.from(labels);
            if (labelsArray.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: labelsArray
              });
            }

            // Assign to author with fallback
            try {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                assignees: [author]
              });
            } catch (e) {
              console.log(`Primary assign failed for ${author}, falling back to ${fallback}:`, e.message);
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                assignees: [fallback]
              });
            }
