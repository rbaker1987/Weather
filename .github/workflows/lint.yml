name: Lint

# The same whole-repo checks run on pushes to master and on every pull request. They used to run
# only on changed files for PRs, which let failures reach master and silently block Render's
# auto-deploy (it waits for all checks on master to pass).

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Set up Node.js (for prettier hook)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install .[dev,django] pre-commit

      # Auto-fixing hooks exit 1 the first time they change a file, so run twice and only fail if
      # the second run still fails. If detect-secrets keeps modifying .secrets.baseline, the diff in
      # the log shows the new line numbers to commit.
      - name: Run pre-commit on all files
        run: |
          pre-commit run --all-files --show-diff-on-failure || \
            pre-commit run --all-files --show-diff-on-failure

  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy django-stubs

      - name: Type check with mypy
        run: mypy weather_app/weather --ignore-missing-imports --no-error-summary 2>&1 | head -50 || true

      - name: Lint with Ruff
        run: ruff check .

      - name: Check formatting with Ruff
        run: ruff format --check .

  lint-javascript:
    name: Lint JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Lint with ESLint
        run: npm run lint:js

      - name: Check formatting with Prettier
        run: npm run format:check
