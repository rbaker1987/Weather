name: Tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  tests:
    name: Run Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
          pip install .[django]
          pip install pytest-django pytest-cov diff-cover

      - name: Run pytest with coverage
        run: |
          PYTHONPATH=weather_app:$PYTHONPATH DJANGO_SETTINGS_MODULE=config.settings pytest -v --cov=weather --cov-fail-under=90 --cov-report=xml --cov-report=html --cov-report=term tests/

      - name: Check pull request coverage
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          diff-cover coverage.xml --compare-branch=origin/${{ github.base_ref }} --fail-under=80

      - name: Django system checks
        env:
          DJANGO_ALLOWED_HOSTS: testserver
          DJANGO_SECRET_KEY: ci-check-6Dkq9mR2xV7pL4sN8wH3bF5jT1yC0eG9aK6uQ2zX7vM4rP8
        run: |
          cd weather_app && python manage.py check --deploy

      - name: Check for missing migrations
        run: |
          cd weather_app && python manage.py makemigrations --check --dry-run

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Comment PR with coverage
        if: github.event_name == 'pull_request'
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 90
          MINIMUM_ORANGE: 80
          COVERAGE_PATH: ./
