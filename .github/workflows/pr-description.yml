name: Validate PR Description

on:
  pull_request:
    types: [opened, edited, reopened]

jobs:
  check-pr-description:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR description is not empty
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = (pr.body || '').trim();

            if (!body || body.length === 0) {
              core.setFailed('PR description is empty. Please provide context for your changes.');
            } else if (body.length < 10) {
              core.setFailed('PR description is too short. Please provide more context.');
            } else {
              core.info('PR description is valid');
            }
