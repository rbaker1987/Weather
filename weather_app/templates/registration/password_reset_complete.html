{% extends "weather/base.html" %}
{% block title %}Password Updated - Ralph's Weather{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card weather-card">
      <div class="card-body">
        <h5 class="mb-3"><i class="fas fa-check-circle"></i> Password updated</h5>
        <p class="text-muted">You can now sign in with your new password.</p>
        <a class="btn btn-primary w-100" href="{% url 'login' %}">Sign In</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
