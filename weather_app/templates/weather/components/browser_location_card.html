{# Reusable browser location card, IDs used by JS handlers #}
<div class="card weather-card h-100 border-0" id="browserLocationCard" style="display: none; cursor: pointer" onclick="if (typeof navigateToBrowserLocation === 'function') navigateToBrowserLocation()">
  <div class="card-body p-3">
    <div class="mb-3">
      <h6 class="card-title mb-0">
        <i class="fas fa-location-arrow text-info me-1" title="Your Location"></i>
        <span id="browserLocationName">Your Location</span>
      </h6>
    </div>
    <div id="browserLocationContent" style="display: none">
      <div class="d-flex align-items-center justify-content-between">
        <div>
          <h2 class="mb-0" id="browserTemp">--°F</h2>
          <p class="mb-0"><small id="browserConditions">--</small></p>
          <p class="mb-0" id="browserHumidity" style="display: none"><small><i class="fas fa-tint"></i> <span></span>%</small></p>
          <p class="mb-0" id="browserWind" style="display: none"><small><i class="fas fa-wind"></i> <span></span></small></p>
        </div>
        <div>
          <i class="fas fa-cloud-sun fa-2x" id="browserWeatherIcon"></i>
        </div>
      </div>
    </div>
    <div id="browserLocationLoading" style="display: none" class="text-center py-3">
      <div class="spinner-border spinner-border-sm text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
      <p class="small mt-2 mb-0">Getting location...</p>
    </div>
    <div id="browserLocationError" style="display: none" class="alert alert-warning mb-0 py-2">
      <small><i class="fas fa-exclamation-triangle"></i> <span></span></small>
    </div>
  </div>
  <div class="card-footer small text-muted" id="browserLocationFooter" style="display: none">
    <i class="fas fa-clock"></i> Just now
  </div>
</div>
